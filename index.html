        flex-direction: column;
        justify-content: center;
        align-items: center;

        width: 100vw;
        background-color: #ffffff;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }

      #flutter-splash.hidden {
        opacity: 0;
        pointer-events: none;
      }

      #flutter-splash img {
        width: 240px;
        max-width: 60vw;
        margin-bottom: 32px;

        width: 40px;
        height: 40px;
        border: 4px solid #e0e0e0;
        border-top-color: #3B4BC8;
        /* Change to your brand color */
        border-radius: 50%;
        animation: flutter-spin 0.9s linear infinite;
      }

      @keyframes flutter-spin {
        to {
          transform: rotate(360deg);
        }
      }
